name: CI

on:
  push:
    branches: [ $default-branch ]
  # No branch filter: the previous filter named `master`, which does not exist here, so pull requests
  # never ran CI. Leaving it open also gives stacked pull requests (based on another branch) a run.
  pull_request:

  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
      # Runs a single command using the runners shell
  buildPr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/ciNoSchema.yml@main
    with:
      suffix: "pr"

  build:
    if: github.event_name == 'release'
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/ci.yml@main
  
  buildBeta:
    if: github.event_name != 'pull_request' && github.event_name != 'release'
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/ci.yml@main
    with:
      suffix: "beta"

  deploy:
    needs: [build,buildBeta]
    if: |
      always()
      && contains(needs.*.result, 'success')
      && !contains(needs.*.result, 'failure')
    # Trusted publishing: lets releaseNuget.yml exchange an OIDC token for a nuget.org key.
    permissions:
      contents: read
      id-token: write
    uses: bielu/bielu.GithubActions.Templates/.github/workflows/releaseNuget.yml@main
    secrets:
      NUGET_APIKEY: ${{ secrets.NUGET_APIKEY }}
