<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Bielu.BetterSearch</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- results inside the lens, best match first -->
  <rect x="150" y="166" width="140" height="26" rx="13" fill="#FFFFFF"/>
  <rect x="150" y="211" width="104" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.72"/>
  <rect x="150" y="256" width="68" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.45"/>
  <!-- magnifier -->
  <circle cx="224" cy="224" r="122" fill="none" stroke="#FFFFFF" stroke-width="40"/>
  <line x1="316" y1="316" x2="408" y2="408" stroke="#FFFFFF" stroke-width="56" stroke-linecap="round"/>
  <!-- the "better" spark -->
  <path d="M404 64 C412 104 420 112 460 120 C420 128 412 136 404 176 C396 136 388 128 348 120 C388 112 396 104 404 64 Z" fill="url(#spark)"/>
</svg>
